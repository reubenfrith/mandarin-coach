[project]
name = "mandarin-coach"
version = "0.1.0"
description = "Personal Mandarin coaching agent — error-intelligence Agentic RAG for lower-intermediate learners"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-openai",
    "langchain-litellm", # ChatLiteLLM wrapper so LLM calls are traced by LangSmith
    "chromadb",
    "litellm",
    "openai",
    "tavily-python",
    "requests", # CC-CEDICT dictionary calls
    "ragas",
    "python-dotenv",
    "pypinyin>=0.55.0",
    "langgraph>=1.2.9",
    "rank-bm25", # BM25 sparse retrieval for the hybrid grammar retriever (Task 6)
    "jieba", # CJK tokenisation so Chinese BM25 doesn't silently fail
    "fastapi", # voice: top-level app mounting Chainlit + voice routes (was transitive)
    "uvicorn", # voice: ASGI server for app.server:app (was transitive via Chainlit)
    "pyjwt", # voice: signs the auth-bridge session cookie (CHAINLIT_AUTH_SECRET)
    "python-multipart", # voice: form parsing for /voice/login (was transitive)
    "librosa>=0.11.0",     # pronunciation coach: pYIN pitch extraction + DTW (app/tone_analysis.py)
    "soundfile>=0.14.0",   # pronunciation coach: decode the browser's WAV audio server-side
    "numpy>=2.4.6",        # pronunciation coach: contour math (also transitive elsewhere)
]

[project.optional-dependencies]
# Eval-only heavy dependency for the Task 6 embedding sweep (BGE-M3 pulls in torch).
# Kept OUT of the default install and the production image. Install for the sweep with:
#   uv sync --extra task6
task6 = [
    "sentence-transformers",   # BGE-M3 local embeddings (Axis 1 candidate — NOT adopted in prod)
]

[tool.uv]
# Application project, not an installable package — uv just manages the venv.
package = false

# Dev-only tooling, installed into the project venv by `uv run` / `uv sync` (not the prod
# image). Pins the test runner to the project's Python 3.12 (+ librosa etc.) so `uv run
# pytest` uses THIS env, not a stray system pytest on an interpreter without the deps.
[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
# The tests are also standalone scripts; collect only tests/ and let tests/conftest.py do
# the env + ChromaDB isolation. Quiet output, and treat unraised warnings as-is.
testpaths = ["tests"]
addopts = "-q"

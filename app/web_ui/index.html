<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mandarin Coach</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Login -->
  <section id="login-view" class="view">
    <div class="card">
      <h1>Mandarin Coach 🀄</h1>
      <p class="sub">Text coach + spoken conversation partner. New username? First login creates it.</p>
      <form id="login-form">
        <input id="username" name="username" placeholder="username" autocomplete="username" required />
        <input id="password" name="password" type="password" placeholder="password" autocomplete="current-password" required />
        <button type="submit">Log in</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </div>
  </section>

  <!-- Onboarding: HSK level -->
  <section id="onboard-view" class="view" hidden>
    <div class="card">
      <h2>Welcome! What's your current Mandarin level?</h2>
      <div class="hsk-options">
        <button data-hsk="HSK 1-2">HSK 1–2 (beginner)</button>
        <button data-hsk="HSK 3-4">HSK 3–4 (intermediate)</button>
        <button data-hsk="HSK 5-6">HSK 5–6 (advanced)</button>
        <button data-hsk="unsure">Not sure</button>
      </div>
    </div>
  </section>

  <!-- Main app -->
  <section id="app-view" class="view" hidden>
    <header>
      <span class="brand">Mandarin Coach</span>
      <nav>
        <button id="tab-pronounce" class="tab active">Pronounce</button>
        <button id="tab-coach" class="tab">Text coach</button>
        <button id="tab-voice" class="tab">Voice partner</button>
      </nav>
      <span class="spacer"></span>
      <span id="whoami" class="muted"></span>
      <button id="logout" class="link">log out</button>
    </header>

    <p id="welcome" class="welcome" hidden></p>

    <!-- Pronunciation coach (default) — compose your own sentence, get it corrected, say it -->
    <div id="pronounce-pane" class="pane">
      <div class="practice">
        <div class="practice-step">
          <label class="step-label">1. Write a sentence in Chinese — your own words.</label>
          <div class="composer">
            <textarea id="pron-input" rows="2" placeholder="e.g. 我昨天去了商店"></textarea>
            <button id="pron-check">Check</button>
          </div>
        </div>

        <div id="pron-target-box" class="practice-step" hidden>
          <label class="step-label">2. Your target — say this out loud.</label>
          <p id="pron-correction" class="correction"></p>
          <div id="pron-syllables" class="syllables"></div>
          <div class="row">
            <button id="pron-hear" class="secondary">🔊 Hear it</button>
            <button id="pron-record">● Record</button>
            <button id="pron-playback" class="secondary" hidden>▶ Hear yourself</button>
            <span id="pron-status" class="muted"></span>
          </div>
        </div>

        <div id="pron-results" class="practice-step" hidden>
          <label class="step-label">3. Your tones</label>
          <div id="pron-score" class="score"></div>
          <canvas id="pron-canvas" width="640" height="180"></canvas>
          <p class="muted canvas-legend">
            <span class="dot red"></span> you &nbsp; <span class="dot grey"></span> target —
            make your line follow the grey line
          </p>
          <div id="pron-result-syllables" class="syllables"></div>
          <p id="pron-note" class="muted"></p>
          <div id="pron-logged" class="logged-list"></div>
        </div>
      </div>
      <audio id="pron-ref-audio"></audio>
      <audio id="pron-take-audio"></audio>
    </div>

    <!-- Text coach -->
    <div id="coach-pane" class="pane" hidden>
      <div id="chat" class="transcript"></div>
      <form id="chat-form" class="composer">
        <textarea id="chat-input" rows="1" placeholder="Type Chinese to check, or ask a question…"></textarea>
        <button type="submit">Send</button>
      </form>
    </div>

    <!-- Voice partner -->
    <div id="voice-pane" class="pane" hidden>
      <div id="voice-transcript" class="transcript"></div>
      <div class="composer voice-controls">
        <button id="record-btn">🎙️ Hold to speak</button>
        <button id="voice-reset" class="link">reset conversation</button>
        <span id="voice-status" class="muted">Speak Mandarin; both turns show 汉字 + pīnyīn.</span>
      </div>
      <audio id="reply-audio" autoplay></audio>
    </div>
  </section>

  <script src="app.js"></script>
  <script src="practice.js"></script>
</body>
</html>

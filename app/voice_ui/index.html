<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mandarin Conversation Partner</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Mandarin Conversation Partner 🗣️</h1>
    <p class="sub">Talk with an AI in Mandarin. Both sides are shown as 汉字 + pīnyīn.
      <a href="/">← back to the text coach</a></p>

    <section id="login">
      <form id="login-form">
        <input id="username" name="username" placeholder="username" autocomplete="username" required />
        <input id="password" name="password" type="password" placeholder="password" autocomplete="current-password" required />
        <button type="submit">Log in</button>
      </form>
      <p id="login-error" class="error" hidden></p>
    </section>

    <section id="conversation" hidden>
      <div class="controls">
        <button id="start-btn">Start conversation</button>
        <button id="stop-btn" hidden>End conversation</button>
        <span id="status" class="status">idle</span>
      </div>
      <div id="transcript" class="transcript" aria-live="polite"></div>
    </section>

    <audio id="remote-audio" autoplay></audio>
  </main>
  <script src="app.js"></script>
</body>
</html>
